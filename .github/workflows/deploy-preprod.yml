# Déploie le site sur GitHub Pages (préprod) à chaque push sur main.
# Prérequis : Settings → Pages → Source = « GitHub Actions ».
name: Déploiement préprod (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un déploiement en cours n'est jamais annulé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Fournit l'URL publique (base_url) et le sous-dossier (base_path) du site Pages :
      # https://<compte>.github.io/<repo> + /<repo>, ou le domaine personnalisé + chemin vide.
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run

      - run: npm run build
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_NOINDEX: "true"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
